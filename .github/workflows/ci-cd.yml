name: CI/CD ResiControl

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "resicontrol-ci-cd"
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validar TypeScript y Compilar Producción
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación de tipos (TypeScript)
        run: npm run lint

      - name: Compilar aplicación frontend (Vite)
        run: npm run build

      - name: Verificar arranque y Healthcheck del servidor
        run: |
          NODE_ENV=production PORT=3000 node server.ts &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/api/ready
          kill $SERVER_PID || true

      - name: Guardar artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: resicontrol-dist
          path: dist/

  deploy-pages:
    name: Desplegar Vista Web (GitHub Pages)
    needs: validate-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar artefacto dist
        uses: actions/download-artifact@v4
        with:
          name: resicontrol-dist
          path: dist/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto a Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
